[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db"

[tool.coverage.run]
source = ["accounts", "patients", "doctors", "mappings"]
omit = ["*/migrations/*", "*/tests/*", "*/management/*"]
