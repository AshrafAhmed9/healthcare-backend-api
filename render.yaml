databases:
  - name: healthcare-db
    plan: free
    databaseName: healthcare
    user: healthcare

services:
  - type: web
    name: healthcare-backend-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_NAME
        fromDatabase:
          name: healthcare-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: healthcare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: healthcare-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: healthcare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: healthcare-db
          property: port
